<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estoque de Bebidas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <div class="login-brand">🍹 Estoque de Bebidas</div>
            <p class="subtitle" style="margin-bottom: 24px;">Entre com seu login e senha.</p>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                    {% for categoria, msg in mensagens %}
                        <div class="flash flash-{{ categoria }}">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label for="login">Login</label>
                    <input type="text" id="login" name="login" required autofocus autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required autocomplete="current-password">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn" style="width:100%;">Entrar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
